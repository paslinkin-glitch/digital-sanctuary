<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <title>Digital Sanctuary</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage" id="stage">
    <section class="slide is-active" data-tag="Shadow">
      <div class="media" aria-hidden="true"></div>
      <span class="tag">Shadow</span>
    </section>
    <section class="slide" data-tag="Trickster">
      <div class="media" aria-hidden="true"></div>
      <span class="tag">Trickster</span>
    </section>
    <section class="slide" data-tag="Abyss">
      <div class="media" aria-hidden="true"></div>
      <span class="tag">Abyss</span>
    </section>
    <section class="slide" data-tag="Calm">
      <div class="media" aria-hidden="true"></div>
      <span class="tag">Calm</span>
    </section>
    <section class="slide" data-tag="Path">
      <div class="media" aria-hidden="true"></div>
      <span class="tag">Path</span>
    </section>
    <div class="veil" aria-hidden="true"></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
