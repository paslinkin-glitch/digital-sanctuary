<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Digital Sanctuary">
  <title>Digital Sanctuary</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage" id="stage">
    <section class="slide is-active" data-tag="Shadow">
      <div class="media" aria-hidden="true"></div>
      <span class="tag">Shadow</span>
    </section>
    <section class="slide" data-tag="Trickster">
      <div class="media" aria-hidden="true"></div>
      <span class="tag">Trickster</span>
    </section>
    <section class="slide" data-tag="Abyss">
      <div class="media" aria-hidden="true"></div>
      <span class="tag">Abyss</span>
    </section>
    <section class="slide" data-tag="Calm">
      <div class="media" aria-hidden="true"></div>
      <span class="tag">Calm</span>
    </section>
    <section class="slide" data-tag="Path">
      <div class="media" aria-hidden="true"></div>
      <span class="tag">Path</span>
    </section>
    <div class="veil" aria-hidden="true"></div>
  </main>
  <div class="entry" id="entry" aria-hidden="true">
    <span class="entry-dot"></span>
  </div>
  <script src="app.js"></script>
</body>
</html>
