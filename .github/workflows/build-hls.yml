name: Build HLS dream catalog

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-hls-dream-catalog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl webp

      - name: Install Python dependencies
        run: pip install boto3

      - name: Build 30 HLS scenes in cloud
        env:
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          AWS_DEFAULT_REGION: ru-1
        run: python scripts/build_hls_cloud.py

      - name: Commit generated catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add videos-data.js videos.json
          if git diff --cached --quiet; then
            echo "Catalog already up to date"
          else
            git commit -m "feat: build 30 new dream scenes and adaptive HLS catalog, v116"
            git push origin main
          fi
