name: Build dream video catalog

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Catalog to build in the cloud"
        required: true
        default: "full-30"
        type: choice
        options:
          - full-30
          - showcase-4k-10

permissions:
  contents: write

concurrency:
  group: build-mp4-dream-catalog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl

      - name: Install Python dependencies
        run: pip install boto3

      # v138 showcase: ten reference 4K nature masters from the open Wikimedia
      # Commons API (Coverr as the reserve), supersampled twice with lanczos into
      # a 1.40-1.85 MB 720x1280 mobile file and a <=7 MB 1080x1920 studio file,
      # uploaded to S3 under mp4-720-4k/ and mp4-1080-4k/.
      - name: Build 10-scene 4K showcase (showcase-4k-10)
        if: ${{ inputs.mode == 'showcase-4k-10' }}
        env:
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          AWS_DEFAULT_REGION: ru-1
        run: python scripts/build_4k_showcase.py

      # The archived thirty-scene dream stays reachable: videos-archive.json and
      # videos-data-archive.js are never touched by either build.
      - name: Build 30 scenes (1080p + 720p + WebP posters) in cloud
        if: ${{ inputs.mode == 'full-30' }}
        env:
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          AWS_DEFAULT_REGION: ru-1
        run: python scripts/build_hls_cloud.py

      - name: Commit generated catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add videos-data.js videos.json
          if git diff --cached --quiet; then
            echo "Catalog already up to date"
            exit 0
          fi
          if [ "${{ inputs.mode }}" = "showcase-4k-10" ]; then
            MESSAGE="chore: publish 10-scene 4K showcase catalog, v138"
          else
            MESSAGE="chore: build 30 scenes with 720p twins and WebP posters"
          fi
          git commit -m "$MESSAGE"
          git push origin main
